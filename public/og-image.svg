<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glow Spheres -->
  <circle cx="150" cy="120" r="180" fill="#10B981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="500" r="220" fill="#06B6D4" opacity="0.12" filter="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <g opacity="0.05" stroke="#F8FAFC" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Inner Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#1F2937" stroke-width="1.5" opacity="0.7"/>

  <!-- Brand Badge (Top Left) -->
  <g transform="translate(90, 85)">
    <!-- Logo Icon -->
    <rect width="56" height="56" rx="16" fill="#0B0F19" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(9, 7) scale(0.12)">
      <path d="M 28 32 C 28 26 33 20 40 20 L 84 20 C 90 20 96 24 99 30 L 146 166 L 114 212 C 110 218 102 220 96 217 L 76 207 C 72 205 69 202 67 198 L 30 38 C 29 36 28 34 28 32 Z" fill="#10B981"/>
      <path d="M 264 32 C 264 26 259 20 252 20 L 208 20 C 202 20 196 24 193 30 L 146 166 L 178 212 C 182 218 190 220 196 217 L 216 207 C 220 205 223 202 225 198 L 262 38 C 263 36 264 34 264 32 Z" fill="#06B6D4"/>
      <path d="M 114 212 L 146 166 L 178 212 L 146 252 Z" fill="#10B981"/>
      <path d="M 146 16 L 180 62 L 146 108 L 112 62 Z" fill="#6EE7B7"/>
      <circle cx="146" cy="62" r="10" fill="#FFFFFF"/>
    </g>
    
    <!-- Studio Name -->
    <text x="72" y="30" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">
      Veridion <tspan fill="#10B981">Studio</tspan>
    </text>
    <text x="72" y="49" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="2">
      HOSPITALITY TECH STUDIO
    </text>
  </g>

  <!-- Special Program Tag (Top Right) -->
  <g transform="translate(800, 90)">
    <rect width="310" height="46" rx="23" fill="#022C22" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="24" cy="23" r="6" fill="#10B981"/>
    <text x="42" y="28" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#6EE7B7">
      PILOT PROGRAM: 2 SLOT GRATIS (S&amp;K)
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(90, 240)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" line-height="1.15">
      Solusi Software Custom &amp;
    </text>
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#brandGrad)">
      Smart POS Kasir UMKM
    </text>
    <text y="140" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
      Mitra digital Cafe &amp; Resto, Apotek, dan Hotel. Konsultasi langsung ke lead developer tanpa perantara.
    </text>
  </g>

  <!-- Bottom Pills: Live Case Studies & Target Industries -->
  <g transform="translate(90, 480)">
    <!-- Pill 1: CV Pelangi Efrata -->
    <rect width="260" height="46" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
      ✓ CV Pelangi Efrata (Live POS)
    </text>

    <!-- Pill 2: Coffee Stand POS -->
    <rect x="275" width="260" height="46" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="295" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
      ✓ Coffee Stand (Demo 24/7)
    </text>

    <!-- Pill 3: Website URL -->
    <rect x="550" width="260" height="46" rx="12" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
    <text x="570" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#10B981">
      🌐 veridionstudio.com
    </text>
  </g>
</svg>

