<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" fill="none">
  <defs>
    <!-- Left Wing Gradient -->
    <linearGradient id="vt_wing_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Right Wing Gradient -->
    <linearGradient id="vt_wing_right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Apex Gem Gradient -->
    <linearGradient id="vt_apex_gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="vt_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(14, 10)">
    <!-- Left Architectural Facet -->
    <path d="M 28 32 C 28 26 33 20 40 20 L 84 20 C 90 20 96 24 99 30 L 146 166 L 114 212 C 110 218 102 220 96 217 L 76 207 C 72 205 69 202 67 198 L 30 38 C 29 36 28 34 28 32 Z" fill="url(#vt_wing_left)" filter="url(#vt_shadow)"/>

    <!-- Right Architectural Facet -->
    <path d="M 264 32 C 264 26 259 20 252 20 L 208 20 C 202 20 196 24 193 30 L 146 166 L 178 212 C 182 218 190 220 196 217 L 216 207 C 220 205 223 202 225 198 L 262 38 C 263 36 264 34 264 32 Z" fill="url(#vt_wing_right)" filter="url(#vt_shadow)"/>

    <!-- Convergence V Point -->
    <path d="M 114 212 L 146 166 L 178 212 L 146 252 Z" fill="url(#vt_wing_left)"/>

    <!-- Hospitality Apex Star / Villa Key -->
    <path d="M 146 16 L 180 62 L 146 108 L 112 62 Z" fill="url(#vt_apex_gem)" filter="url(#vt_shadow)"/>
    <path d="M 146 16 L 180 62 L 146 108 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- Center Core Node -->
    <circle cx="146" cy="62" r="6" fill="#FFFFFF"/>
  </g>
</svg>
